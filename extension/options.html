<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Дирижёр — настройки</title>
    <style>
      body {
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 460px;
        margin: 30px auto;
        padding: 0 16px;
        color: #1c1c1e;
      }
      h1 { font-size: 18px; }
      label { display: block; margin: 14px 0 4px; font-size: 13px; font-weight: 600; }
      input {
        width: 100%;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .hint { font-size: 12px; color: #777; margin-top: 3px; }
      .row { display: flex; gap: 8px; margin-top: 18px; }
      button {
        padding: 9px 14px;
        font-size: 14px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      #save { background: #2563eb; color: #fff; }
      #ping { background: #efefef; }
      #msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    </style>
  </head>
  <body>
    <h1>🎼 Дирижёр — настройки расширения</h1>
    <p class="hint">Значения берутся из команды бота <code>/meeting_capture</code>.</p>

    <label for="apiBase">API base URL</label>
    <input id="apiBase" placeholder="http://localhost:8080" />
    <div class="hint">Адрес HTTP-API бота (без завершающего «/»).</div>

    <label for="chatId">chat_id</label>
    <input id="chatId" placeholder="-1001234567890" />
    <div class="hint">Telegram-чат, куда бот пришлёт задачи из созвона.</div>

    <label for="token">Токен (X-Dirizher-Token)</label>
    <input id="token" placeholder="значение DIRIZHER_API__SHARED_SECRET" />

    <div class="row">
      <button id="save">Сохранить</button>
      <button id="ping">Проверить связь</button>
    </div>
    <div id="msg"></div>

    <script src="options.js"></script>
  </body>
</html>
